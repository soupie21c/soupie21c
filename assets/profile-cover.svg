<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">수지로운생활, 디자인부터 구현까지 하는 디자이너</title>
  <desc id="description">도면의 격자와 재단선 위에 한국어 소개 문구와 설계·구현·검증 세 가지 원칙을 담은 어두운 에디토리얼 프로필 커버.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1012" />
      <stop offset="1" stop-color="#121b1e" />
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#3fd3ad" stop-opacity="0.16" />
      <stop offset="1" stop-color="#3fd3ad" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7c8" />
      <stop offset="1" stop-color="#2fb38f" />
    </linearGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fd3ad" stop-opacity="0" />
      <stop offset="0.5" stop-color="#3fd3ad" stop-opacity="0.9" />
      <stop offset="1" stop-color="#3fd3ad" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .sans { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
  </style>

  <!-- 배경 -->
  <rect width="1200" height="440" fill="url(#bg)" />
  <rect width="1200" height="440" fill="url(#grid)" />
  <rect width="1200" height="440" fill="url(#glow)" />
  <rect x="0" y="0" width="1200" height="1.5" fill="url(#hairline)" />

  <!-- 재단선 (도면 코너 마크) -->
  <g stroke="#5f716d" stroke-width="1" fill="none" opacity="0.7">
    <path d="M32 52V32H52" />
    <path d="M1148 32H1168V52" />
    <path d="M32 388V408H52" />
    <path d="M1148 408H1168V388" />
  </g>

  <!-- 왼쪽: 메인 카피 -->
  <g class="sans">
    <text x="72" y="92" fill="#7d8f8b" font-size="13" letter-spacing="3.5">수지로운생활<tspan fill="#3fd3ad" dx="10">—</tspan><tspan dx="10">DESIGN NOTE · 2026</tspan></text>

    <text x="70" y="182" fill="#eef2ef" font-size="56" font-weight="600" letter-spacing="-1.6">그리는 데서 멈추지 않고,</text>
    <text x="70" y="254" fill="url(#accent)" font-size="56" font-weight="700" letter-spacing="-1.6">직접 만들어 냅니다.</text>

    <line x1="72" y1="296" x2="136" y2="296" stroke="#3fd3ad" stroke-width="2" stroke-linecap="round" />

    <text x="72" y="342" fill="#eef2ef" font-size="14" font-weight="600" letter-spacing="3">DESIGNER WHO CODES<tspan fill="#3fd3ad" dx="8" letter-spacing="0">·</tspan><tspan fill="#8a9b97" dx="12" font-size="15" font-weight="400" letter-spacing="0">디자인부터 구현까지</tspan></text>

    <text x="72" y="384" fill="#4f605c" font-size="12" letter-spacing="1.5" class="mono">@soupie21c</text>
  </g>

  <!-- 오른쪽: 디자인 원칙 카드 -->
  <rect x="772" y="72" width="356" height="296" rx="18" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.08" />

  <g class="sans">
    <text x="804" y="114" fill="#7d8f8b" font-size="11" letter-spacing="3">DESIGN PRINCIPLES</text>
    <text x="1096" y="114" fill="#4f605c" font-size="12" text-anchor="end">디자인 원칙</text>

    <text x="804" y="170" fill="#3fd3ad" font-size="12" class="mono">01</text>
    <text x="840" y="172" fill="#eef2ef" font-size="21" font-weight="600">설계</text>
    <text x="1096" y="171" fill="#5f716d" font-size="12" letter-spacing="1.5" text-anchor="end">DESIGN</text>
    <line x1="804" y1="194" x2="1096" y2="194" stroke="#ffffff" stroke-opacity="0.07" />

    <text x="804" y="232" fill="#3fd3ad" font-size="12" class="mono">02</text>
    <text x="840" y="234" fill="#eef2ef" font-size="21" font-weight="600">구현</text>
    <text x="1096" y="233" fill="#5f716d" font-size="12" letter-spacing="1.5" text-anchor="end">BUILD</text>
    <line x1="804" y1="256" x2="1096" y2="256" stroke="#ffffff" stroke-opacity="0.07" />

    <text x="804" y="294" fill="#3fd3ad" font-size="12" class="mono">03</text>
    <text x="840" y="296" fill="#eef2ef" font-size="21" font-weight="600">검증</text>
    <text x="1096" y="295" fill="#5f716d" font-size="12" letter-spacing="1.5" text-anchor="end">TEST</text>

    <circle cx="808" cy="337" r="3" fill="#3fd3ad" />
    <text x="822" y="342" fill="#8fe6cf" font-size="13">손에 잡히는 디자인을 합니다</text>
  </g>
</svg>
